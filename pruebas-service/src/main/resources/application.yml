server:
  port: 8082

spring:
  application:
    name: pruebas-service
  datasource:
    # Base de datos propia de este servicio; se crea sola la primera vez (MySQL de Laragon).
    url: jdbc:mysql://localhost:3306/electra_pruebas?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      client:
        config:
          # Si usuarios-service no responde a tiempo, se corta y se responde 503.
          usuarios-service:
            connect-timeout: 3000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
