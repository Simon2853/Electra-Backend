server:
  port: 8084

spring:
  application:
    name: archivos-service
  datasource:
    # BD propia: solo guarda los datos de cada archivo (nombre, tipo, tamaño, quién lo subió).
    url: jdbc:mysql://localhost:3306/electra_archivos?createDatabaseIfNotExist=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      # Una foto de celular comprimida pesa ~1-3 MB; más de 5 MB se rechaza con 413.
      max-file-size: 5MB
      max-request-size: 6MB

# Carpeta donde se guardan las imágenes (fuera del repositorio, ver .gitignore).
archivos:
  directorio: uploads

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

springdoc:
  swagger-ui:
    path: /swagger-ui.html
